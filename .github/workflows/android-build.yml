name: Two Ladles Android Debug APK Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"

jobs:
  build-android-apk:
    name: Build Android Debug APK (Godot 4.7.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Ephemeral Debug Keystore (Never Committed)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Download & Verify Godot 4.7.2-stable & Export Templates
        run: |
          mkdir -p "${{ runner.temp }}/godot-bin"
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          BASE_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}"

          curl -fsSL "${BASE_URL}/SHA512-SUMS.txt" -o "${{ runner.temp }}/SHA512-SUMS.txt"
          curl -fsSL "${BASE_URL}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip" -o "${{ runner.temp }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          curl -fsSL "${BASE_URL}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" -o "${{ runner.temp }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"

          cd "${{ runner.temp }}"
          grep "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          grep "Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" SHA512-SUMS.txt | sha512sum -c -

          unzip -q "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip" -d "${{ runner.temp }}/godot-bin"
          chmod +x "${{ runner.temp }}/godot-bin/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64"

          unzip -q "Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" -d "${{ runner.temp }}/tpz-extract"
          mv "${{ runner.temp }}/tpz-extract/templates/"* ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}/

      - name: Configure Godot Editor Android SDK & Debug Keystore Paths
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Project & Export Android Debug APK
        run: |
          GODOT="${{ runner.temp }}/godot-bin/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64"
          mkdir -p build/android
          "$GODOT" --headless --import
          "$GODOT" --headless --export-debug "Android" build/android/two-ladles-debug.apk
          ls -lh build/android/two-ladles-debug.apk

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: two-ladles-android-debug-apk-${{ github.sha }}
          path: build/android/two-ladles-debug.apk
          retention-days: 30
