<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e242d"/>
      <stop offset="50%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0a0d11"/>
    </linearGradient>

    <!-- Metallic & Culinary Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c04e38"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#c04e38" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5"/>

  <!-- Subtle Culinary Circular Emblem -->
  <circle cx="128" cy="128" r="92" fill="url(#centerGlow)"/>
  <circle cx="128" cy="128" r="94" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.35"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.15"/>

  <!-- Rising Steam Swirls (Simmering Hot Broth) -->
  <g stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#softGlow)">
    <!-- Center Wisp -->
    <path d="M 128,88 C 123,76 133,66 128,52 C 124,42 129,34 128,26"/>
    <!-- Left Wisp -->
    <path d="M 110,84 C 105,74 113,64 109,52 C 106,44 110,38 108,30" opacity="0.6"/>
    <!-- Right Wisp -->
    <path d="M 146,84 C 151,74 143,64 147,52 C 150,44 146,38 148,30" opacity="0.6"/>
  </g>

  <!-- ============================================== -->
  <!-- LADLE 1 (Vietnam - Linh): Gold/Brass Broth Ladle -->
  <!-- Top-Left to Bottom-Right                        -->
  <!-- ============================================== -->
  <g filter="url(#shadow)">
    <!-- Shaft & Hook -->
    <!-- Hanging Hook Eyelet -->
    <circle cx="56" cy="46" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <!-- Shaft Body -->
    <path d="M 62,52 L 158,150" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 63,53 L 157,149" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Bowl of Ladle 1 (Bottom-Right) -->
    <!-- Outer Bowl Shell -->
    <ellipse cx="178" cy="172" rx="34" ry="24" transform="rotate(42 178 172)" fill="url(#goldGrad)"/>
    <!-- Inner Bowl Cavity -->
    <ellipse cx="178" cy="172" rx="27" ry="17" transform="rotate(42 178 172)" fill="#78350f"/>
    <!-- Shimmering Golden Phở Broth Pool -->
    <ellipse cx="179" cy="173" rx="22" ry="12" transform="rotate(42 178 172)" fill="url(#goldGrad)" opacity="0.95"/>
    <ellipse cx="176" cy="170" rx="14" ry="6" transform="rotate(42 178 172)" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- ============================================== -->
  <!-- LADLE 2 (Korea - Jiwon): Crimson/Steel Soup Ladle -->
  <!-- Top-Right to Bottom-Left                       -->
  <!-- ============================================== -->
  <g filter="url(#shadow)">
    <!-- Shaft & Hook -->
    <!-- Hanging Hook Eyelet -->
    <circle cx="200" cy="46" r="10" fill="none" stroke="url(#steelGrad)" stroke-width="4.5"/>
    <!-- Shaft Body -->
    <path d="M 194,52 L 98,150" stroke="url(#steelGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 193,53 L 99,149" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Bowl of Ladle 2 (Bottom-Left) -->
    <!-- Outer Bowl Shell -->
    <ellipse cx="78" cy="172" rx="34" ry="24" transform="rotate(-42 78 172)" fill="url(#steelGrad)"/>
    <!-- Inner Bowl Cavity -->
    <ellipse cx="78" cy="172" rx="27" ry="17" transform="rotate(-42 78 172)" fill="#4c0519"/>
    <!-- Spicy Gochujang Broth Pool -->
    <ellipse cx="77" cy="173" rx="22" ry="12" transform="rotate(-42 78 172)" fill="url(#crimsonGrad)" opacity="0.95"/>
    <ellipse cx="80" cy="170" rx="14" ry="6" transform="rotate(-42 78 172)" fill="#fda4af" opacity="0.8"/>
  </g>

  <!-- Center Intersection Clasp / Crest Pin -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="120" r="13" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="3"/>
    <circle cx="128" cy="120" r="6" fill="#f59e0b"/>
  </g>

  <!-- Bottom Ceramic Cradle Arch (Bowl Base) -->
  <path d="M 88,214 C 112,230 144,230 168,214" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="128" cy="223" r="3" fill="#fef08a"/>
</svg>
